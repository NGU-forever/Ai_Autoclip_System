services:
  db:
    image: pzm2mntd3t74vneyhy.xuanyuan.run/pgvector/pgvector:pg15-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: uploader
      POSTGRES_PASSWORD: uploader
      POSTGRES_DB: uploader
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uploader -d uploader"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "63799:6379"

  uploader:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c '
        ln -sf /usr/share/novnc/vnc.html /usr/share/novnc/index.html &&
        echo "=== Starting Xvfb ===" &&
        Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
        export DISPLAY=:99 &&
        echo "Waiting for Xvfb to be ready..." &&
        for i in $(seq 1 30); do
          if [ -e /tmp/.X11-unix/X99 ]; then
            echo "Xvfb is ready (took $${i}s)";
            break;
          fi;
          sleep 1;
        done &&
        echo "=== Starting Fluxbox ===" &&
        fluxbox &
        sleep 0.5 &&
        echo "=== Starting x11vnc ===" &&
        x11vnc -display :99 -nopw -forever -shared -rfbport 5900 -xkb &
        sleep 0.5 &&
        echo "=== Starting noVNC ===" &&
        websockify --web=/usr/share/novnc 6080 localhost:5900 &
        echo "=== Starting Uploader API ===" &&
        uvicorn main:app --host 0.0.0.0 --port 8002
      '
    restart: unless-stopped
    ports:
      - "8002:8002"
      - "5900:5900"
      - "6080:6080"
    environment:
      - DATABASE_URL=postgresql://uploader:uploader@db:5432/uploader
      - REDIS_URL=redis://redis:6379/0
      - UPLOADER_HEADLESS=false
      - UPLOADER_INDEPENDENT=true
      - PYTHONPATH=/app
      - DISPLAY=:99
    volumes:
      - ../storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=10).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5

  uploader-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      celery -A src.tasks.celery_app.celery_app worker --loglevel=info --concurrency=1 --pool=solo --hostname=uploader-worker@%h
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://uploader:uploader@db:5432/uploader
      - REDIS_URL=redis://redis:6379/0
      - UPLOADER_INDEPENDENT=true
      - PYTHONPATH=/app
    volumes:
      - ../storage:/app/storage
    depends_on:
      - redis
      - uploader

volumes:
  postgres_data:
