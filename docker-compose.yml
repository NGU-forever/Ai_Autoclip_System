# ============================================================
# docker-compose.yml — 默认面向生产/客户私有化部署
# 启动: docker compose up -d --build
# ============================================================

services:

  # ----------------------------------------------------------
  # db: PostgreSQL 15 database
  # ----------------------------------------------------------
  db:
    image: pzm2mntd3t74vneyhy.xuanyuan.run/pgvector/pgvector:pg15-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-b2b_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-b2b_password}
      POSTGRES_DB: ${POSTGRES_DB:-b2b_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-b2b_user} -d ${POSTGRES_DB:-b2b_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------
  # redis: For SSE event streaming
  # ----------------------------------------------------------
  redis:
    image: pzm2mntd3t74vneyhy.xuanyuan.run/redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ----------------------------------------------------------
  # uploader: 抖音/视频号/小红书发布（Playwright，独立进程）
  # ----------------------------------------------------------
  uploader:
    build:
      context: ./AgentOs-Uploader
      dockerfile: Dockerfile
      args:
        APT_USE_TENCENT_MIRROR: ${APT_USE_TENCENT_MIRROR:-0}
        VITE_LOGIN_PAGE_URL: ${VITE_LOGIN_PAGE_URL:-http://localhost/login}
        VITE_MAIN_APP_ORIGIN: ${VITE_MAIN_APP_ORIGIN:-http://localhost}
    restart: unless-stopped
    ports:
      - "8002:8002"
      # 交互式浏览器登录的 noVNC 端口
      - "6080:6080"
      - "5900:5900"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-b2b_user}:${POSTGRES_PASSWORD:-b2b_password}@db:5432/${POSTGRES_DB:-b2b_db}
      UPLOADER_HEADLESS: "true"
      REDIS_URL: redis://redis:6379/0
      DISPLAY: ":99"
      # DEV_MODE: 独立运行模式（不检查登录）
      UPLOADER_INDEPENDENT: "true"
      # VNC 配置
      VNC_PORT: "5900"
      NOVNC_PORT: "6080"
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command:
      - sh
      - -c
      - |
        ln -sf /usr/share/novnc/vnc.html /usr/share/novnc/index.html
        
        # 启动虚拟显示
        echo "=== Starting Xvfb ==="
        Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset > /dev/null 2>&1 &
        
        echo "Waiting for Xvfb to be ready..."
        for i in $$(seq 1 30); do
          if [ -e /tmp/.X11-unix/X99 ]; then
            echo "Xvfb is ready (took $${i}s)"
            break
          fi
          sleep 1
        done
        
        echo "=== Starting Fluxbox ==="
        fluxbox > /dev/null 2>&1 &
        sleep 0.5
        
        # 启动 VNC 服务器
        echo "=== Starting x11vnc ==="
        x11vnc -display :99 -nopw -forever -rfbport 5900 -shared -noxdamage -xkb > /dev/null 2>&1 &
        sleep 0.5
        
        # 启动 noVNC
        echo "=== Starting noVNC ==="
        websockify --web=/usr/share/novnc 0.0.0.0:6080 localhost:5900 > /dev/null 2>&1 &
        
        echo "========================================"
        echo "Uploader services started:"
        echo "  - API: http://0.0.0.0:8002"
        echo "  - noVNC: http://localhost:6080"
        echo "  - VNC: localhost:5900"
        echo "========================================"
        
        # 启动主应用
        exec uvicorn main:app --host 0.0.0.0 --port 8002
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=10).read()\"" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ----------------------------------------------------------
  # uploader-worker: Celery Worker —— 持久化发布任务执行器
  # 与 uploader 共享同一镜像，仅覆盖启动命令。
  # 关键说明：
  #   --pool=solo   : Playwright 依赖 asyncio 事件循环，prefork(默认) 会 fork 进程破坏 loop，须用 solo
  #   --concurrency=1: 同一时间最多 1 个 Playwright Chromium，防止 OOM（每个约 300MB）
  # ----------------------------------------------------------
  uploader-worker:
    build:
      context: ./AgentOs-Uploader
      dockerfile: Dockerfile
      args:
        APT_USE_TENCENT_MIRROR: ${APT_USE_TENCENT_MIRROR:-0}
        VITE_LOGIN_PAGE_URL: ${VITE_LOGIN_PAGE_URL:-http://localhost/login}
        VITE_MAIN_APP_ORIGIN: ${VITE_MAIN_APP_ORIGIN:-http://localhost}
    command:
      - /bin/sh
      - -c
      - |
        # 启动虚拟显示
        Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
        sleep 2
        # 验证 DISPLAY 设置
        export DISPLAY=:99
        echo "DISPLAY=$DISPLAY"
        # 启动 Celery Worker
        exec celery -A src.tasks.celery_app.celery_app worker --loglevel=info --concurrency=1 --pool=solo --hostname=uploader-worker@%h
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-b2b_user}:${POSTGRES_PASSWORD:-b2b_password}@db:5432/${POSTGRES_DB:-b2b_db}
      UPLOADER_HEADLESS: "true"
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app:/app/uploader
      DISPLAY: ":99"
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_started
      uploader:
        condition: service_healthy

  # ----------------------------------------------------------
  # web: FastAPI (auth + Storyline)
  # ----------------------------------------------------------
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APT_USE_TENCENT_MIRROR: ${APT_USE_TENCENT_MIRROR:-0}
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-b2b_user}:${POSTGRES_PASSWORD:-b2b_password}@db:5432/${POSTGRES_DB:-b2b_db}
      REDIS_URL: redis://redis:6379/0
      OPENSTORYLINE_PUBLIC_URL: ${OPENSTORYLINE_PUBLIC_URL:-http://localhost/clip}
      OPENSTORYLINE_INTERNAL_URL: http://storyline:7860
      # 开发模式：true 时绕过登录认证
      DEV_MODE: "${DEV_MODE:-true}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./storage:/app/storage # 核心存储挂载（代码来自镜像，不挂载 backend）
      # 挂载 uploader 代码，以便复用浏览器模块
      - ./AgentOs-Uploader/src:/app/uploader/src:ro
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()" ]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 90s

  # ----------------------------------------------------------
  # storyline: AgentOs-OpenStoryline（OpenStoryline 定制目录）
  # ----------------------------------------------------------
  storyline:
    build:
      context: ./AgentOs-OpenStoryline
      dockerfile: Dockerfile
      args:
        APT_USE_TENCENT_MIRROR: ${APT_USE_TENCENT_MIRROR:-0}
    restart: unless-stopped
    ports:
      - "7860:7860"
      - "8001:8001"
    volumes:
      - ./AgentOs-OpenStoryline/config.toml:/app/config.toml
      # 资源与模型落到仓库内本地目录（持久化；首次若目录为空请先在本机执行: cd AgentOs-OpenStoryline && bash download.sh）
      - ./AgentOs-OpenStoryline/resource:/app/resource
      - ./AgentOs-OpenStoryline/.storyline:/app/.storyline
      - ./storage:/app/storage # 与 config 中 media_dir / outputs_dir / server_cache_dir 对应（/storage/...）
    depends_on:
      web:
        condition: service_healthy

  # ----------------------------------------------------------
  # user-frontend: React (Vite) user dashboard on port 80
  # ----------------------------------------------------------
  user-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.conf
        VITE_UPLOADER_QIANKUN_ENTRY: ${VITE_UPLOADER_QIANKUN_ENTRY:-/uploader-ui/}
        VITE_OPENSTORYLINE_QIANKUN_ENTRY: ${VITE_OPENSTORYLINE_QIANKUN_ENTRY:-/openstoryline-ui/}
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./storage/exports:/usr/share/nginx/html/downloads:ro # 允许用户下载成片
    depends_on:
      web:
        condition: service_healthy
      storyline:
        condition: service_started
      uploader:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
