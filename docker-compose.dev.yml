# ============================================================
# 本地开发：挂载 backend 源码并启用 Uvicorn --reload
# 使用: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# ============================================================

services:
  web:
    environment:
      DEV_MODE: "true"
    volumes:
      - ./backend:/app

  uploader:
    environment:
      DEV_MODE: "true"
    volumes:
      - ./backend:/app/backend
      - ./AgentOs-Uploader:/app/uploader
    command:
      [
        "uvicorn",
        "uploader.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8002",
        "--reload",
      ]
